services:
  postgres:
    image: postgres:16-alpine
    container_name: fintogether-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fintogether
      POSTGRES_USER: fintogether
      POSTGRES_PASSWORD: fintogether
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintogether -d fintogether"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data: